<!doctype html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

    {% seo %}

    <link rel="stylesheet" href="{{ 'assets/css/style.css' | relative_url }}">
    <script src="https://code.jquery.com/jquery-1.12.4.min.js" integrity="sha256-ZosEbRLbNQzLpnKIkEdrPv7lOy9C27hHQ+Xp8a4MxAQ=" crossorigin="anonymous"></script>

    <!-- Custom Forensic Identity Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "ArchiveOrganization",
          "@id": "https://thomas-dall-archive.github.io/thomas-dall-archive/#organization",
          "name": "Thomas Dall Forensic Archive",
          "description": "The definitive chronological repository of evidence regarding Tim Dooley (formerly Thomas Dall). Documenting identity transitions and the Kota Files.",
          "url": "https://thomas-dall-archive.github.io/thomas-dall-archive/",
          "sameAs": [
            "https://thomas-dall-archive.pages.dev"
          ],
          "keywords": "Evidence, Public Record, Thomas Dall, Tom Dall, Tim Dooley, Potato of Life, The Kota Files, Archival"
        },
        {
          "@type": "Person",
          "name": "Tim Dooley",
          "alternateName": [
            "Thomas Dall",
            "Tom Dall",
            "The Potato of Life"
          ],
          "description": "Subject of the forensic archive regarding identity shifts and public conduct.",
          "sameAs": [
            "https://www.youtube.com/@ThePotatoofLife",
            "https://x.com/PotatoOfLife",
            "https://www.youtube.com/@MondoCane-btw",
            "https://www.youtube.com/@ThomasDallArchive",
            "https://www.youtube.com/@jandall"
          ],
          "subjectOf": { "@id": "https://thomas-dall-archive.github.io/thomas-dall-archive/#organization" }
        }
      ]
    }
    </script>
  </head>
  <body>
  <!-- 1. The Top Navigation Bar -->
  <header id="header">
    <div class="wrapper">
      <ul>
        <li class="fork"><a href="{{ site.github.repository_url }}">View On GitHub</a></li>
      </ul>
    </div>
  </header>

  <div class="wrapper">
    <section>
      <!-- 2. The Title/Description Branding Block -->
      <div id="title">
        <h1>{{ site.title }}</h1>
        <p>{{ site.description }}</p>
        <hr>
        <span class="credits left">Project maintained by <a href="{{ site.github.owner_url }}">{{ site.github.owner_name }}</a></span>
      </div>

      <!-- 3. Your Archive Content (The Kota Files, etc.) -->
      {{ content }}
      
    </section>
  </div>
</body>
</html>
