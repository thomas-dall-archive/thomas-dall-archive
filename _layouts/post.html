---
layout: default
---

<div class="forensic-log-wrapper">
  <h1 class="intercept-title">{{ page.title }}</h1>
  
  <p class="intercept-meta">
    FILE DATE: {{ page.date | date: "%B %d, %Y" }} | STATUS: LOGGED
  </p>

  <div class="intercept-content">
    {{ content }}
  </div>

  <hr style="margin-top: 40px; border-color: #444;">
  <p><a href="{{ '/' | relative_url }}" style="color: #ffc107; text-decoration: none;">⬅️ Return to Main Archive Terminal</a></p>
</div>

<style>
  /* 1. THE KILL SWITCH: Hides the theme's broken header (#) */
  #main-content h1:first-child, 
  section h1:first-child,
  header h1:first-child {
    display: none !important;
  }

  /* 2. THE RESTORATION: Styles your actual title */
  .intercept-title {
    color: #ffc107 !important;
    text-transform: uppercase !important;
    font-weight: 800 !important;
    font-size: 2.2em !important;
    margin-bottom: 5px !important;
    display: block !important;
    border: none !important; /* Removes theme underline */
  }

  .intercept-meta {
    color: #ffc107 !important;
    font-family: monospace !important;
    border-bottom: 1px solid #444 !important;
    padding-bottom: 10px !important;
    font-size: 0.9em !important;
  }

  /* 3. TRANSCRIPT STYLING */
  .intercept-content h3 {
    color: #ffc107 !important;
    border-left: 3px solid #ffc107;
    padding-left: 10px;
    margin-top: 30px;
    text-transform: uppercase;
  }

  .intercept-content a {
    color: #ffc107;
  }
</style>
