---
layout: default
---
<article class="forensic-log">
  <header>
    <div class="log-title-force" style="color: #ffc107 !important; text-transform: uppercase; font-weight: 800; font-size: 2.2em; margin-bottom: 10px; line-height: 1.1; display: block !important; visibility: visible !important;">
      {{ page.title }}
    </div>
    
    <p style="color: #ffc107; font-family: monospace; border-bottom: 1px solid #444; padding-bottom: 10px; font-size: 0.9em; margin-top: 0;">
      FILE DATE: {{ page.date | date: "%B %d, %Y" }} | STATUS: LOGGED
    </p>
  </header>

  <div class="evidence-body" style="color: #eee; line-height: 1.6; margin-top: 20px;">
    {{ content }}
  </div>

  <hr style="margin-top: 40px; border-color: #444;">
  <p><a href="{{ '/' | relative_url }}" style="color: #ffc107; text-decoration: none;">⬅️ Return to Main Archive Terminal</a></p>
</article>

<style>
  /* 1. This hides the theme's "Auto-Header" which is causing the stray '#' symbol */
  /* It specifically targets the first H1 in the section created by the Midnight theme */
  section h1:first-child {
    display: none !important;
  }

  /* 2. Style the headers inside your transcript/description */
  .evidence-body h1, .evidence-body h2, .evidence-body h3 {
    color: #ffc107 !important;
    border-left: 3px solid #ffc107;
    padding-left: 10px;
    margin-top: 30px;
    text-transform: uppercase;
    font-size: 1.2em;
  }
  
  .evidence-body a {
    color: #ffc107;
    text-decoration: underline;
  }
</style>
