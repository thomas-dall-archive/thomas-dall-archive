---
layout: default
---
<article class="forensic-log">
  <header>
    <h1 class="log-title" style="color: #ffc107 !important; text-transform: uppercase; font-weight: 800; margin-bottom: 5px; display: block !important;">
      {{ page.title }}
    </h1>
    
    <p style="color: #ffc107; font-family: monospace; border-bottom: 1px solid #444; padding-bottom: 10px; font-size: 0.9em;">
      FILE DATE: {{ page.date | date: "%B %d, %Y" }} | STATUS: LOGGED
    </p>
  </header>

  <div class="evidence-body" style="color: #eee; line-height: 1.6;">
    {{ content }}
  </div>

  <hr style="margin-top: 40px; border-color: #444;">
  <p><a href="{{ '/' | relative_url }}" style="color: #ffc107; text-decoration: none;">⬅️ Return to Main Archive Terminal</a></p>
</article>

<style>
  /* This hides the theme's default title so we don't get the double-header or the stray '#' */
  header h1:first-child {
    display: none;
  }
  
  /* Ensure our custom log title actually shows up */
  .log-title {
    display: block !important;
    visibility: visible !important;
  }
</style>
