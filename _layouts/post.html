---
layout: default
---
<article class="forensic-log">
  <header>
    <h1 style="color: #ffc107; text-transform: uppercase; font-weight: 800; margin-bottom: 5px;">
      {{ page.title }}
    </h1>
    
    <p style="color: #ffc107; font-family: monospace; border-bottom: 1px solid #444; padding-bottom: 10px; font-size: 0.9em;">
      FILE DATE: {{ page.date | date: "%B %d, %Y" }} | STATUS: LOGGED
    </p>
  </header>

  <div class="evidence-body" style="color: #eee; line-height: 1.6;">
    {{ content }}
  </div>

  <hr style="margin-top: 40px; border-color: #444;">
  <p><a href="{{ '/' | relative_url }}" style="color: #ffc107; text-decoration: none;">⬅️ Return to Main Archive Terminal</a></p>
</article>

<style>
  /* This ensures all sub-headings in the transcript/description also turn yellow */
  .evidence-body h1, .evidence-body h2, .evidence-body h3 {
    color: #ffc107 !important;
    border-left: 3px solid #ffc107;
    padding-left: 10px;
    margin-top: 30px;
  }
  
  .evidence-body a {
    color: #ffc107;
  }
</style>
