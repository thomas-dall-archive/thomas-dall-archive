---
layout: default
---
<article class="forensic-log">
  <header>
    <h1>{{ page.title }}</h1>
    <p style="color: #00ff00; font-family: monospace; border-bottom: 1px solid #444; padding-bottom: 10px;">
      FILE DATE: {{ page.date | date: "%B %d, %Y" }} | STATUS: LOGGED
    </p>
  </header>

  <div class="evidence-body">
    {{ content }}
  </div>

  <hr style="margin-top: 40px; border-color: #444;">
  <p><a href="{{ '/' | relative_url }}">⬅️ Return to Main Archive Terminal</a></p>
</article>
