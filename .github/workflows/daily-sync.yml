name: Daily Archive Sync
on:
  schedule:
    - cron: '0 0 * * *' # Runs at midnight every day
  workflow_dispatch: # Allows you to run it manually to test

jobs:
  update-gallery:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Install yt-dlp
        run: sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp && sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Fetch Latest Video Data
        run: |
          # This command gets the last 5 videos from your target channel
          # Replace 'CHANNEL_URL' with the actual link
          yt-dlp --get-title --get-id --get-thumbnail --playlist-end 5 "CHANNEL_URL" > raw_data.txt
          
      - name: Update JSON and Commit
        run: |
          # (A small python or bash script here would format the raw_data into your archive.json)
          git config user.name "thomas-dall-archive"
          git config user.email "thomasdallarchive@gmail.com"
          git add archive.json
          git commit -m "🤖 Auto-update: New evidence synced" || exit 0
          git push
