name: Process Shirt Update
on:
  issues:
    types: [opened] 

permissions:
  contents: write
  issues: write

jobs:
  update-tracker:
    if: >
      contains(github.event.issue.labels.*.name, 'shirt-update') && 
      github.event.issue.user.login == 'thomas-dall-archive'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history so rebase works correctly

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Process Issue and Update JSON
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python update_shirt.py

      - name: Commit and Push
        run: |
          git config user.name "Hygiene Bot"
          git config user.email "bot@github.com"
          git add shirt_data.json
          
          # Only commit if the JSON actually changed
          git commit -m "Automated Tracker Update: New Shirt Logged" || exit 0
          
          # Force the bot to sync with any changes you made locally first
          git pull --rebase origin main
          
          git push
          
      - name: Close the Issue
        uses: peter-evans/close-issue@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          comment: "✅ Tracker successfully updated. The page will reflect changes shortly."
