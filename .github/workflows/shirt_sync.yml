name: Process Shirt Update
on:
  issues:
    types: [opened] 

permissions:
  contents: write
  issues: write

jobs:
  update-tracker:
    if: >
      contains(github.event.issue.labels.*.name, 'shirt-update') && 
      github.event.issue.user.login == 'thomas-dall-archive'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Process Issue and Update JSON
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python update_shirt.py

      - name: Generate Jekyll Post for Feed
        run: |
          mkdir -p _posts
          # Format filename: YYYY-MM-DD-issue-number.md
          FILENAME="_posts/$(date +'%Y-%m-%d')-shirt-log-${{ github.event.issue.number }}.md"
          
          echo "---" > $FILENAME
          echo "layout: post" >> $FILENAME
          echo "title: 'Shirt Watch Update: ${{ github.event.issue.title }}'" >> $FILENAME
          echo "date: $(date +'%Y-%m-%d %H:%M:%S') -0000" >> $FILENAME
          echo "categories: [shirt-watch, forensic-log]" >> $FILENAME
          echo "tags: [Tim Dooley, Thomas Dall, The Potato of Life]" >> $FILENAME
          echo "---" >> $FILENAME
          echo "### 📊 Automated Forensic Observation" >> $FILENAME
          echo "" >> $FILENAME
          echo "This log entry was automatically generated via the forensic monitoring tool." >> $FILENAME
          echo "" >> $FILENAME
          echo "${{ github.event.issue.body }}" >> $FILENAME
          echo "" >> $FILENAME
          echo "---" >> $FILENAME
          echo "#### [Return to Main Forensic Archive](https://thomas-dall-archive.github.io/thomas-dall-archive/)" >> $FILENAME

      - name: Commit and Push
        run: |
          git config user.name "Hygiene Bot"
          git config user.email "bot@github.com"
          
          # Add both the JSON data AND the new Post
          git add shirt_data.json
          git add _posts/*.md
          
          git commit -m "Automated Tracker & Feed Update: Logged Shirt Evidence" || exit 0
          
          git pull --rebase origin main
          git push
          
      - name: Close the Issue
        uses: peter-evans/close-issue@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          comment: "✅ Tracker and Forensic Feed successfully updated. Search engines have been notified."
