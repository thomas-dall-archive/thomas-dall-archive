name: Daily Sync
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Dependencies
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          # This installs the JS runtime yt-dlp is asking for
          sudo apt-get update
          sudo apt-get install -y nodejs
          
      - name: Run Global Sync
        run: |
         # 1. Sync Video Evidence Archive
         cd archive
         python update_archive.py
         cd ..
         
      - name: Save Changes
        run: |
          git config user.name "Archive Bot"
          git config user.email "bot@github.com"
          git add archive/archive.json transcripts/primary_transcripts.json
          git commit -m "Updated gallery and transcripts" || exit 0
          git push
