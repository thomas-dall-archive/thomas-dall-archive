name: Daily Sync
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install yt-dlp
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          
      - name: Run Global Sync
        run: |
         # 1. Sync Video Evidence Archive (Mirrors)
         cd archive
         python update_archive.py
         cd ..
         
         # 2. Sync Primary Transcripts (Subject's Main Channel)
         cd transcripts
         python update_transcripts.py
         cd ..
         
      - name: Save Changes
        run: |
          git config user.name "Archive Bot"
          git config user.email "bot@github.com"
          # Explicitly stage both forensic datasets
          git add archive/archive.json transcripts/primary_transcripts.json
          git commit -m "Automated Sync: Video Gallery & Primary Transcripts" || exit 0
          git push
