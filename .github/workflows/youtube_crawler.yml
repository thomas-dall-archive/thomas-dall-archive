name: YouTube Surveillance Crawler

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch: # Allows you to click a "Run Now" button manually

permissions:
  contents: write

jobs:
  intercept:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # NOTE: No 'pip install' needed anymore because we switched to JSON!

      - name: Run Crawler
        run: python youtube_crawler.py

      - name: Commit New Evidence
        run: |
          git config user.name "Surveillance Crawler"
          git config user.email "bot@github.com"
          
          # This catches _posts/*.md AND _data/videos.json automatically
          git add -A
          
          # Only commit if there are actually changes detected
          if ! git diff --staged --quiet; then
            git commit -m "Automated Intercept: New YouTube Broadcast Logged"
            git pull --rebase origin main
            git push
          else
            echo "No new evidence found to commit."
          fi
